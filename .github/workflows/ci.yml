name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Hugo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Single source of truth for the Hugo version is netlify.toml.
      - name: Resolve pinned Hugo version
        id: hugo
        run: echo "version=$(sed -n 's/.*HUGO_VERSION = "\(.*\)".*/\1/p' netlify.toml)" >> "$GITHUB_OUTPUT"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true
      # --panicOnWarning enforces the "clean build, no WARN/ERROR" bar (AGENTS.md).
      - name: Build
        run: hugo --gc --minify --panicOnWarning

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.49.0

  markdown:
    name: Markdown (rumdl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rvben/rumdl@v0
        with:
          report-type: annotations

  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: editorconfig-checker/action-editorconfig-checker@v2.2.0
      - run: editorconfig-checker

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
