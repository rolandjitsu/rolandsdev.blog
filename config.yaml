# https://gohugo.io/getting-started/configuration/#baseurl
baseURL: "https://rolandsdev.blog/"

# https://gohugo.io/getting-started/configuration/#defaultcontentlanguage
defaultContentLanguage: "en"
# https://gohugo.io/getting-started/configuration/#locale
# (replaces languageCode, deprecated in Hugo v0.158.0)
locale: "en"

# https://gohugo.io/getting-started/configuration/#title
title: "Roland's Dev Blog"

# https://gohugo.io/getting-started/configuration/#theme
theme: "DoIt"

# https://gohugo.io/getting-started/configuration/#enablegitinfo
enableGitInfo: true
# https://gohugo.io/getting-started/configuration/#enablerobotstxt
enableRobotsTXT: true

# https://gohugo.io/getting-started/configuration/#enableemoji
enableEmoji: true

# https://gohugo.io/content-management/menus/
menu:
  main:
    - identifier: "posts"
      pre: ""
      post: ""
      name: "Posts"
      url: "/posts/"
      title: ""
      weight: 1
    - identifier: "tags"
      pre: ""
      post: ""
      name: "Tags"
      url: "/tags/"
      title: ""
      weight: 2
    - identifier: "categories"
      pre: ""
      post: ""
      name: "Categories"
      url: "/categories/"
      title: ""
      weight: 3
    - identifier: "series"
      pre: ""
      post: ""
      name: "Series"
      url: "/series/"
      title: ""
      weight: 4
    - identifier: "github"
      pre: "<i class='fab fa-github fa-fw'></i>"
      post: ""
      name: ""
      url: "https://github.com/rolandjitsu"
      title: "GitHub"
      weight: 5

# https://gohugo.io/getting-started/configuration/#markup
# https://gohugo.io/getting-started/configuration-markup
markup:
  highlight:
    codeFences: true
    lineNoStart: 1
    lineNos: true
    noClasses: false
    style: vs
    tabWidth: 2

# https://hugodoit.pages.dev/theme-documentation-basics/#site-configuration
params:
  version: "0.4.X"

  title: ""
  description: "A collection of dev guides, tutorials and thoughts on various tech stacks, tools and programming languages."

  # "light"/"dark"/"black"/"auto"
  defaultTheme: "auto"

  gitRepo: "https://github.com/rolandjitsu/rolandsdev.blog"

  dateFormat: "2006-01-02"

  images: ["/images/avatar_sm.png"]

  # https://hugodoit.pages.dev/pwa-support
  enablePWA: true

  # license: '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  # TODO: Doesn't work!
  # https://github.com/HEIGE-PCloud/DoIt/issues/475
  # bundle: yes

  search:
    enable: true
    # lunr/algolia/fuse
    type: "fuse"
    placeholder: ""
    maxResultLength: 10
    snippetLength: 30
    highlightTag: "em"
    absoluteURL: false
    fuse:
      isCaseSensitive: false

  header:
    # "fixed"/"normal"/"auto"
    desktopMode: "fixed"
    mobileMode: "auto"
    # "switch"/"select"
    themeChangeMode: "switch"
    title:
      name: "Roland's Dev Blog"
      typeit: true

  footer:
    enable: true
    hugo: true
    hostedOn: '<a title="Netlify" href="https://www.netlify.com/" target="_blank" rel="noopener noreffer">Netlify</a>'
    copyright: true
    author: true
    # since: 2020
    # license: '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  # Posts
  section:
    paginate: 10
    dateFormat: "01-02"
    rss: 10

  # Category/Tags
  list:
    paginate: 10
    dateFormat: "01-02"
    rss: 10

  home:
    profile:
      enable: true
      avatarURL: "/images/avatar_sm.webp"
      title: ""
      subtitle: "A collection of dev guides, tutorials and thoughts on various tech stacks, tools and programming languages."
      social: true
      posts:
        enable: true
        paginate: 4

  # Social links rendered on the home profile (keys map to themes/DoIt/assets/data/social.yml)
  # Non-true values are treated as the account id and appended to that entry's Prefix.
  social:
    GitHub: rolandjitsu
    LinkedIn: rolandgroza
    RSS: true

  page:
    # https://hugodoit.pages.dev/theme-documentation-content/#extended-markdown-syntax
    ruby: false
    fraction: false
    # NOTE: inline `:fa-*:` icons were removed in DoIt v1.0 (params.page.fontawesome
    # now hard-errors the build). Use the `fa-icon` shortcode instead if needed.
    linkToMarkdown: true
    linkToSource: "https://github.com/rolandjitsu/rolandsdev.blog/blob/main/content/{path}"
    linkToEdit: "https://github.com/rolandjitsu/rolandsdev.blog/edit/main/content/{path}"
    linkToReport: "https://github.com/rolandjitsu/rolandsdev.blog/issues/new"
    pageStyle: "normal"
    seriesNavigation: true
    toc:
      enable: true
      keepStatic: false
      auto: true
    code:
      copy: true
      maxShownLines: 100
    table:
      sort: true
    math:
      enable: false
    comment:
      enable: true
      giscus:
        enable: true
        # owner/repo
        dataRepo: "rolandjitsu/rolandsdev.blog"
        dataRepoId: "R_kgDOHBwhkg"
        dataCategory: "General"
        dataCategoryId: "DIC_kwDOHBwhks4COZWW"
        dataMapping: "pathname"
        dataReactionsEnabled: "1"
        dataEmitMetadata: "0"
        dataInputPosition: "bottom"
        lightTheme: "light"
        darkTheme: "dark"
        dataLang: "en"

  sponsor:
    enable: true
    bio: "If you find this post helpful, please consider sponsoring."
    link: "https://github.com/sponsors/rolandjitsu"
    custom: ""

  verification:
    google: ""

  # https://hugodoit.pages.dev/theme-documentation-extended-features/#analytics
  # Cloudflare Web Analytics (free, cookieless — no GDPR consent banner needed).
  # The theme injects the beacon script; we only supply the site token.
  analytics:
    enable: true
    cloudflare:
      token: "192171eab31648f784d78dd36d9cf1d6"

author:
  name: "rolandjitsu"
  email: "rolandjitsu@gmail.com"
  link: "https://github.com/rolandjitsu"

# https://gohugo.io/content-management/urls/#permalinks
permalinks:
  offline: /offline

# Needed for search
# https://hugodoit.pages.dev/theme-documentation-basics/#search
outputs:
  home: ["HTML", "RSS", "JSON"]
  # page: ["HTML", "MarkDown"]
  # section: ["HTML", "RSS"]
  # taxonomy: ["HTML", "RSS"]
  # taxonomyTerm: ["HTML"]

# https://gohugo.io/getting-started/configuration/#taxonomies
# https://gohugo.io/content-management/taxonomies#configure-taxonomies
taxonomies:
  author: "authors"
  category: "categories"
  tag: "tags"
  series: "series"
